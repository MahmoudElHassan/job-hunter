name: Job Hunter — Scheduled Scan

# Runs the scanner 4× per day every day (incl. Fri–Sat), Makkah local times.
# Cron uses UTC; 05:00 UTC = 08:00 Asia/Riyadh (UTC+3, no DST in KSA).
# 05, 09, 13, 17 UTC = 08, 12, 16, 20 Makkah local.

on:
  schedule:
    - cron: "0 5,9,13,17 * * *"     # Every day, 4×/day
  workflow_dispatch:                  # Manual trigger from Actions tab
    inputs:
      mode:
        description: "Scan mode"
        required: true
        type: choice
        default: full
        options:
          - full
          - quick
      query:
        description: "One-off query (only with 'custom' mode)"
        required: false
        type: string

permissions:
  contents: write   # To commit scan results back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.mode }}" = "custom" ] && [ -n "${{ inputs.query }}" ]; then
            python job_hunter.py --query "${{ inputs.query }}"
          elif [ "${{ inputs.mode }}" = "quick" ]; then
            python job_hunter.py --quick
          else
            python job_hunter.py
          fi

      - name: Commit results
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M UTC') — auto-update"
            git push
          fi
