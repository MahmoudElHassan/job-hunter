name: Job Hunter — Daily Digest

# Every evening at 18:00 UTC (= 21:00 Makkah local) — daily summary to Telegram.
# Lists the day's finds + pipeline status, even if scan added nothing.

on:
  schedule:
    - cron: "0 18 * * 0-4"   # Sun–Thu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/daily_digest.py
