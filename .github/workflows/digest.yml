name: Job Hunter — Daily Digest

# Every Sunday/Tuesday/Thursday at 18:00 UTC (= 21:00 Makkah local) — digest to Telegram.
# Lists the day's finds + pipeline status, even if scan added nothing.
# Aligned with scan.yml so off-days do not get empty digests.

on:
  schedule:
    - cron: "0 18 * * 0,2,4"   # Sun/Tue/Thu 21:00 Makkah
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/daily_digest.py
